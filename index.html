<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Games · Ricky</title>
<meta name="author" content="Ricky">
<meta name="description" content="五个能直接在浏览器里玩的小游戏：太空塔防、跑打射击、推石解谜、落沙沙盒、猫咪合成。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305080d'/%3E%3Crect x='6' y='6' width='8' height='8' fill='%235eead4'/%3E%3Crect x='18' y='6' width='8' height='8' fill='%23f2b544'/%3E%3Crect x='6' y='18' width='8' height='8' fill='%239db4c8'/%3E%3Crect x='18' y='18' width='8' height='8' fill='%23e8845f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/mg.css"><script src="shared/mg.js"></script>
<style>
  :root {
    --bg: #05080d;
    --panel: #0a121b;
    --line: #1b2c3a;
    --line-hi: #2f6f6a;
    --text: #d8e6ef;
    --dim: #6f8899;
    --accent: #5eead4;
    --accent-2: #f2b544;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 460px at 18% -10%, rgba(94, 234, 212, .10), transparent 70%),
      radial-gradient(760px 420px at 92% 8%, rgba(242, 181, 68, .07), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "Sora", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 64px;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; }

  header { width: 100%; max-width: 1040px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--dim);
  }
  h1 {
    margin: 10px 0 0;
    font-size: clamp(30px, 6vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .sub {
    margin: 14px 0 0;
    max-width: 50ch;
    font-size: 14px; line-height: 1.85; color: #8ba3b3;
  }
  .rule {
    margin: 26px 0 0; height: 1px; width: 100%;
    background: linear-gradient(90deg, var(--line-hi), var(--line) 55%, transparent);
  }

  main {
    width: 100%; max-width: 1040px;
    margin-top: 30px;
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(186px, 1fr));
  }
  a.card {
    position: relative;
    display: flex; flex-direction: column;
    padding: 20px 18px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    text-decoration: none; color: inherit;
    transition: border-color .18s, transform .18s, background .18s;
    overflow: hidden;
  }
  a.card::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 2px;
    background: var(--tone, var(--accent));
    opacity: .55; transition: opacity .18s;
  }
  a.card:hover, a.card:focus-visible {
    border-color: var(--tone, var(--accent));
    background: #0c1620;
    transform: translateY(-2px);
    outline: none;
  }
  a.card:hover::before, a.card:focus-visible::before { opacity: 1; }

  .no { font-size: 11px; letter-spacing: .22em; color: var(--dim); }
  .name {
    margin: 12px 0 0; font-size: 20px; line-height: 1.25; font-weight: 600;
    letter-spacing: -0.01em;
  }
  .name small { display: block; margin-top: 3px; font-size: 11.5px; font-weight: 400; color: var(--dim); letter-spacing: .06em; }
  .desc {
    margin: 10px 0 0; flex: 1;
    font-size: 12.5px; line-height: 1.75; color: #7e94a4;
  }
  .tags { margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span {
    font-size: 10.5px; line-height: 1; padding: 5px 7px;
    border: 1px solid #22374a; border-radius: 2px; color: #86a0b2;
  }
  .go {
    margin: 16px 0 0; display: flex; align-items: center; gap: 7px;
    font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--tone, var(--accent));
  }
  .go i {
    display: inline-block; width: 7px; height: 7px;
    background: currentColor;
    transition: transform .18s;
  }
  a.card:hover .go i { transform: translateX(4px); }

  footer {
    width: 100%; max-width: 1040px; margin-top: 40px;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline;
    justify-content: space-between;
    font-size: 11.5px; color: #55697a;
  }
  footer a { color: #7e94a4; text-decoration: none; border-bottom: 1px solid #23384a; }
  footer a:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 560px) {
    body { padding: 40px 16px 48px; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="eyebrow mono">Mini Games / Static / No Build</div>
    <div id="mgLangSlot"></div>
  </div>
  <h1><span data-t-zh="五个小游戏，" data-t-en="Five small games, "></span><em data-t-zh="打开就能玩" data-t-en="ready to play"></em></h1>
  <p class="sub" data-t-zh="都是纯静态页面，没有后端，浏览器直接跑。五种完全不同的玩法：塔防、跑打射击、推石解谜、落沙沙盒、猫咪合成。"
     data-t-en="Plain static pages, no backend — straight into the browser. Five completely different genres: tower defense, run &amp; gun, boulder puzzling, falling-sand sandbox, cat merging."></p>
  <div class="rule"></div>
</header>

<main>
  <a class="card" href="tower-defense/" style="--tone:#5eead4">
    <div class="no mono">01 / STRATEGY</div>
    <h2 class="name"><span data-t-zh="EXO 深空防线" data-t-en="EXO"></span><small>Exo · Tower Defense</small></h2>
    <p class="desc" data-t-zh="在陌生星球的轨道上建基地、架炮塔，扛住一波比一波凶的进攻。资源只有矿物和能量两种，花在哪条线上决定你能不能活过第十波。"
       data-t-en="Build stations and turrets in orbit of an unknown world, and hold out against wave after wave. Only two resources — minerals and energy; where you spend them decides whether you live past wave ten."></p>
    <div class="tags">
      <span data-t-zh="塔防" data-t-en="Tower defense"></span>
      <span data-t-zh="鼠标操作" data-t-en="Mouse"></span>
      <span data-t-zh="无图片资源" data-t-en="No sprite assets"></span>
    </div>
    <div class="go mono"><span data-t-zh="进入" data-t-en="Enter"></span> <i></i></div>
  </a>

  <a class="card" href="space-huggers/index.html" style="--tone:#f2b544">
    <div class="no mono">02 / ACTION</div>
    <h2 class="name">Space Huggers<small>Run &amp; Gun Roguelike</small></h2>
    <p class="desc" data-t-zh="横版跑打，地形可以炸开，墙被打穿后会露出后面的敌人。九条命、四波杂兵、一个会追着你打的关底，死一次地图重排。"
       data-t-en="Side-scrolling run &amp; gun with destructible terrain — blast a wall and whatever hid behind it comes out. Nine lives, four waves of grunts, one boss that hunts you down; die and the map reshuffles."></p>
    <div class="tags">
      <span data-t-zh="射击" data-t-en="Shooter"></span>
      <span data-t-zh="键盘 · 手柄" data-t-en="Keys · Gamepad"></span>
      <span data-t-zh="可破坏地形" data-t-en="Destructible terrain"></span>
    </div>
    <div class="go mono"><span data-t-zh="进入" data-t-en="Enter"></span> <i></i></div>
  </a>

  <a class="card" href="boulder-dash/index.html" style="--tone:#9db4c8">
    <div class="no mono">03 / PUZZLE</div>
    <h2 class="name">Boulder Dash<small>Dig · Push · Survive</small></h2>
    <p class="desc" data-t-zh="挖开泥土找宝石，推动石头开路，但石头会往下掉 —— 掉在你头上就没了。每关要拿够宝石才能开出口，限时。"
       data-t-en="Dig through dirt for diamonds, shove boulders aside — but boulders fall, and one landing on your head is fatal. Every cave needs a minimum diamond count before the exit opens, against the clock."></p>
    <div class="tags">
      <span data-t-zh="解谜" data-t-en="Puzzle"></span>
      <span data-t-zh="方向键" data-t-en="Arrow keys"></span>
      <span data-t-zh="C64 经典" data-t-en="C64 classic"></span>
    </div>
    <div class="go mono"><span data-t-zh="进入" data-t-en="Enter"></span> <i></i></div>
  </a>

  <a class="card" href="project-sand/index.html" style="--tone:#e8845f">
    <div class="no mono">04 / SANDBOX</div>
    <h2 class="name"><span data-t-zh="沙盒魔法" data-t-en="Sandbox Magic"></span><small>Project Sand · Falling Sand</small></h2>
    <p class="desc" data-t-zh="没有输赢的物理沙盒：沙子会堆、水会流、火会烧、酸会溶。二十多种元素互相反应，笔刷一画就能搭出一整套连锁。"
       data-t-en="A sandbox with no win state: sand piles up, water flows, fire burns, acid dissolves. Twenty-plus elements react to one another — one brush stroke can set off a whole chain."></p>
    <div class="tags">
      <span data-t-zh="沙盒" data-t-en="Sandbox"></span>
      <span data-t-zh="鼠标绘制" data-t-en="Mouse drawing"></span>
      <span data-t-zh="元素反应" data-t-en="Element reactions"></span>
    </div>
    <div class="go mono"><span data-t-zh="进入" data-t-en="Enter"></span> <i></i></div>
  </a>

  <a class="card" href="cat-merge/" style="--tone:#c9b3f5">
    <div class="no mono">05 / MERGE</div>
    <h2 class="name"><span data-t-zh="猫咪合成" data-t-en="Cat Merge"></span><small>Cat Merge · Physics Merge</small></h2>
    <p class="desc" data-t-zh="把猫从上面丢下去，两只一样的碰到一起就合成更大的一只，一路合到第十级。物理引擎负责堆叠：猫会滚、会滑、会卡进缝里，堆过虚线就结束。"
       data-t-en="Drop cats from above; two matching ones merge into a bigger cat, up to tier ten. A physics engine does the stacking — cats roll, slide and wedge into gaps, and the round ends if the pile crosses the line."></p>
    <div class="tags">
      <span data-t-zh="合成" data-t-en="Merge"></span>
      <span data-t-zh="鼠标 / 触屏" data-t-en="Mouse / touch"></span>
      <span data-t-zh="手帐画风" data-t-en="Notebook art"></span>
    </div>
    <div class="go mono"><span data-t-zh="进入" data-t-en="Enter"></span> <i></i></div>
  </a>
</main>

<footer>
  <div>
    <span data-t-zh="© 2026 Ricky · 五个项目都在仓库" data-t-en="© 2026 Ricky · All five live in the"></span>

    <a href="THIRD-PARTY.md">THIRD-PARTY.md</a>
  </div>
  <div class="mono" data-t-zh="无服务端 · 无构建 · 纯静态" data-t-en="NO SERVER · NO BUILD · PURE STATIC"></div>
</footer>

  MG.init({ id: "hub", dock: false, mount: "#mgLangSlot", autoHelp: false });

</body>
